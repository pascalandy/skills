pr-assignee = "pascalandy"
retro-max-issues = 2 # chef-closing, head-chef: issues each thread files per retro

[head-chef]
merge-confidence = 92 # head-chef: give the green light without asking at or above this %
max-parallel = 2      # head-chef: Chefs at work at once, only when the user asks for parallel batches
retro = true

[chef] # Steps 1 to 7, one Chef per batch, launched by the Head Chef
chef-on-claude = { inherit = true }
chef-on-codex = { inherit = true }
service-tier = "standard"
runtime-mode = "inherit"
retro = true

[cook] # Step 1: Implement
chef-on-claude = { inherit = true }
chef-on-codex = { inherit = true }
delegate-on-claude = { instance = "codex", model = "gpt-6.1-sol", reasoning-level = "high" } # cook-implement: a Cook on Claude Code delegates to this target
service-tier = "standard"
runtime-mode = "inherit"
skip-in-fast-track = false
retro = true

[manic-1] # Step 2: Adversarial review, beside manic-2
chef-on-claude = { instance = "codex", model = "gpt-6.1-sol", reasoning-level = "high" }
chef-on-codex = { instance = "claudeAgent", model = "claude-opus-5-5", reasoning-level = "xhigh" }
service-tier = "standard"
runtime-mode = "inherit"
max-passes = 3
skip-in-fast-track = true

[manic-2] # Step 2: Blast-radius review, beside manic-1
chef-on-claude = { instance = "codex", model = "gpt-6.1-sol", reasoning-level = "high" }
chef-on-codex = { instance = "claudeAgent", model = "claude-opus-5-5", reasoning-level = "xhigh" }
service-tier = "standard"
runtime-mode = "inherit"
max-passes = 2
skip-in-fast-track = true

[docwriter] # Step 3: Docs updates
chef-on-claude = { instance = "codex", model = "gpt-6.1-sol", reasoning-level = "high" }
chef-on-codex = { inherit = true }
service-tier = "standard"
runtime-mode = "inherit"
skip-in-fast-track = true

[manic-3] # Step 4: Docs review
chef-on-claude = { instance = "codex", model = "gpt-6.1-sol", reasoning-level = "high" }
chef-on-codex = { instance = "claudeAgent", model = "claude-opus-5-5", reasoning-level = "high" }
service-tier = "standard"
runtime-mode = "inherit"
max-passes = 2
skip-in-fast-track = true

[manic-5] # Step 5: Pristine review
chef-on-claude = { instance = "codex", model = "gpt-6.1-sol", reasoning-level = "high" }
chef-on-codex = { instance = "claudeAgent", model = "claude-opus-5-5", reasoning-level = "xhigh" }
service-tier = "standard"
runtime-mode = "inherit"
max-passes = 2
skip-in-fast-track = true
