pr-assignee = "pascalandy"

[chef]
merge-confidence = 92 # chef-closing: merge without asking at or above this %
retro-max-issues = 2  # chef-closing: issues each thread files per retro
retro = true

[cook] # Step 1: Implement
chef-on-claude = { inherit = true }
chef-on-codex = { inherit = true }
service-tier = "standard"
runtime-mode = "inherit"
skip-in-fast-track = false
retro = true

[manic-1] # Step 2: Adversarial review
chef-on-claude = { instance = "codex", model = "gpt-6.1-sol", reasoning-level = "xhigh" }
chef-on-codex = { instance = "claudeAgent", model = "claude-opus-5-5", reasoning-level = "xhigh" }
service-tier = "standard"
runtime-mode = "inherit"
max-passes = 3
skip-in-fast-track = true
retro = false

[manic-2] # Step 3: Blast-radius review
chef-on-claude = { instance = "codex", model = "gpt-6.1-sol", reasoning-level = "xhigh" }
chef-on-codex = { instance = "claudeAgent", model = "claude-opus-5-5", reasoning-level = "xhigh" }
service-tier = "standard"
runtime-mode = "inherit"
max-passes = 2
skip-in-fast-track = true
retro = false

[docwriter] # Step 4: Docs updates
chef-on-claude = { inherit = true }
chef-on-codex = { inherit = true }
service-tier = "standard"
runtime-mode = "inherit"
skip-in-fast-track = true
retro = false

[manic-3] # Step 5: Docs review
chef-on-claude = { instance = "codex", model = "gpt-6.1-sol", reasoning-level = "high" }
chef-on-codex = { instance = "claudeAgent", model = "claude-opus-5-5", reasoning-level = "high" }
service-tier = "standard"
runtime-mode = "inherit"
max-passes = 2
skip-in-fast-track = true
retro = false

[manic-5] # Step 6: Pristine review
chef-on-claude = { instance = "codex", model = "gpt-6.1-sol", reasoning-level = "xhigh" }
chef-on-codex = { instance = "claudeAgent", model = "claude-opus-5-5", reasoning-level = "xhigh" }
service-tier = "standard"
runtime-mode = "inherit"
max-passes = 2
skip-in-fast-track = true
retro = false
