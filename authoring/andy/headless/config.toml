# scripts/headless.py reads these defaults. A --model or --effort flag overrides them.
# A model is an alias, such as sol, or an explicit ID. The fleet skill's
# references/active-models.toml resolves an alias when the fleet skill is
# installed; otherwise the launcher's own defaults apply (STANDALONE_MODELS).
# harness selects the CLI when the command names none.
# The launcher runs codex, claude, and grok. Pi and OpenCode await #281.
# provider applies only to Pi and OpenCode.
# Codex, Claude Code, and Grok select their own providers.
harness = "codex"

[codex]
model = "sol"
reasoning-level = "xhigh"

[claude]
model = "opus"
reasoning-level = "xhigh"

[grok]
model = "grok"
reasoning-level = "xhigh"

[pi]
provider = "openai-codex"
model = "sol"
reasoning-level = "xhigh"

[opencode]
provider = "openai"
model = "gpt-6-astra"
reasoning-level = "high"
