# scripts/headless.py reads these defaults. A --model or --effort flag overrides them.
# harness selects the CLI when the command names none.
# The launcher runs codex, claude, and grok. Pi and OpenCode await #281.
# provider applies only to Pi and OpenCode.
# Codex, Claude Code, and Grok select their own providers.
harness = "codex"

[codex]
model = "gpt-6.1-sol"
reasoning-level = "xhigh"

[claude]
model = "claude-opus-5-5"
reasoning-level = "xhigh"

[grok]
model = "grok-4.7"
reasoning-level = "xhigh"

[pi]
provider = "openai-codex"
model = "gpt-6.1-sol"
reasoning-level = "xhigh"

[opencode]
provider = "openai"
model = "gpt-6-astra"
reasoning-level = "high"
