service-tier = "standard" # Launching role: default for thread and delegate selections
runtime-mode = "inherit" # All threads: retain inherited modes throughout the run
pr-assignee = "pascalandy" # Cook: assign every PR
retro-max-issues = 2 # Head Chef and Cook: issue limit per thread per retro

[head-chef]
max-parallel = 4 # Head Chef: simultaneous Cooks when Decisions allow parallel
retro = true # Head Chef: run its closing retros

[cook]
head-chef-on-claude = { instance = "claudeAgent", model = "opus", reasoning-level = "high" } # Head Chef: Cook selection
head-chef-on-codex = { inherit = true } # Head Chef: Cook selection
on-request-codex = { instance = "codex", model = "sol" } # Head Chef: Cook when Pascal asks for Codex or Sol
on-request-dsf = { instance = "pi", model = "openrouter-hub/ds4p1-slow", reasoning-level = "max" } # Head Chef: Cook when Pascal asks for DSF
delegate-on-claude = { instance = "codex", model = "sol" } # Cook on Claude: side work target
retro = true # Cook: run its closing retros

[watchdog]
watch-on-claude = { instance = "claudeAgent", model = "haiku" } # Head Chef on Claude: same-provider Watchdog
watch-on-codex = { instance = "codex", model = "terra" } # Head Chef on Codex: same-provider Watchdog
watch-minutes = 15 # Watchdog: schedule interval
stall-minutes = 60 # Watchdog: idle threshold for a Cook on 🍳
max-wakes = 2 # Watchdog: counted wakes before alert
progress-hours = 8 # Watchdog: long-batch alert interval

[qa]
selection = "cook" # Head Chef: a QA agent uses the selection of the Cook of the first batch it tests

[loop-1] # Cook: reviewer of loop 1, on each PR; review-loop owns the round budget
cook-on-claude = { instance = "codex", model = "sol" }
cook-on-codex = { instance = "claudeAgent", model = "opus" }
cook-on-pi = { instance = "codex", model = "sol" }

[loop-2] # Cook: reviewer of loop 2, once on the whole stack; review-loop owns the round budget
cook-on-claude = { instance = "codex", model = "sol" }
cook-on-codex = { instance = "claudeAgent", model = "opus" }
cook-on-pi = { instance = "codex", model = "sol" }
