service-tier = "standard" # Launching role: default for thread and delegate selections
runtime-mode = "inherit" # All threads: retain inherited modes throughout the run
pr-assignee = "pascalandy" # Cook: assign every PR
retro-max-issues = 2 # Head Chef and Cook: issue limit per thread per retro

[head-chef]
max-parallel = 2 # Head Chef: simultaneous Cooks when Decisions allow parallel
retro = true # Head Chef: run its closing retros

[cook]
head-chef-on-claude = { instance = "codex", model = "gpt-6.1-sol", reasoning-level = "xhigh" } # Head Chef: Cook selection
head-chef-on-codex = { inherit = true } # Head Chef: Cook selection
delegate-on-claude = { instance = "codex", model = "gpt-6.1-sol", reasoning-level = "xhigh" } # Cook on Claude: side work target
retro = true # Cook: run its closing retros

[watchdog]
watch-on-claude = { instance = "claudeAgent", model = "claude-haiku-5-5", reasoning-level = "high" } # Head Chef on Claude: same-provider Watchdog
watch-on-codex = { instance = "codex", model = "gpt-6-luna", reasoning-level = "high" } # Head Chef on Codex: same-provider Watchdog
watch-minutes = 15 # Watchdog: schedule interval
stall-minutes = 60 # Watchdog: idle threshold for a Cook on 🍳
max-wakes = 2 # Watchdog: counted wakes before alert

[loop-1] # Cook: reviewer of loop 1, on each PR; review-loop owns the round budget
cook-on-claude = { instance = "codex", model = "gpt-6.1-sol", reasoning-level = "xhigh" }
cook-on-codex = { instance = "claudeAgent", model = "claude-opus-5-5", reasoning-level = "xhigh" }

[loop-2] # Cook: reviewer of loop 2, once on the whole stack; review-loop owns the round budget
cook-on-claude = { instance = "codex", model = "gpt-6.1-sol", reasoning-level = "xhigh" }
cook-on-codex = { instance = "claudeAgent", model = "claude-opus-5-5", reasoning-level = "xhigh" }
