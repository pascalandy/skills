output:
  - execution_out
  - failure

pre-commit:
  commands:
    gitleaks:
      run: just gitleaks-staged
    frontmatter:
      glob: "authoring/**/SKILL.md"
      run: just check-frontmatter
    flattened-skills:
      glob: "{authoring,skills}/**/*"
      run: just flatten-skills --check
    remote-skills:
      glob: "{skills/**/SKILL.md,docs/references/remote-skills*.md}"
      run: just remote-skills --check

# In a main checkout with the private clone, a pull or a push of main starts
# background deployment of published main to every machine, including this
# one. Worktrees and other branches skip it; a local commit starts nothing
post-merge:
  commands:
    sync-skills:
      run: just sync-hook post-merge

post-rewrite:
  commands:
    sync-skills:
      run: just sync-hook post-rewrite {1}

# Lefthook skips a pre-push command whose push only deletes files. Keep a script
# so a deletion pushed to main still starts published fleet deployment
pre-push:
  scripts:
    "sync-skills.sh":
      runner: sh
      use_stdin: true
