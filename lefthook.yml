output:
  - execution_out
  - failure

pre-commit:
  commands:
    gitleaks:
      run: just gitleaks-staged
    frontmatter:
      glob: "authoring/**/SKILL.md"
      run: just check-frontmatter
    compiled-skills:
      glob: "{authoring/**/*,skills/**/*,docs/references/skill-count.md}"
      run: just compile-skills --check
    remote-skills:
      glob: "{skills/**/SKILL.md,docs/references/remote-skills*.md}"
      run: just remote-skills --check

# In a main checkout with the private clone, a commit installs this machine, a pull
# also syncs the other machines in the background, and a push of main syncs
# them once GitHub has it. sync-hook exits early everywhere else, including
# worktrees and other branches
post-commit:
  commands:
    sync-skills:
      run: just sync-hook post-commit

post-merge:
  commands:
    sync-skills:
      run: just sync-hook post-merge

post-rewrite:
  commands:
    sync-skills:
      run: just sync-hook post-rewrite {1}

# A script, not a command: lefthook skips a pre-push command whose push only
# deletes files, and that push must still reach the fleet
pre-push:
  scripts:
    "sync-skills.sh":
      runner: sh
      use_stdin: true
